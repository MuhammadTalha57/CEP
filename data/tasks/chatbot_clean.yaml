  - {id: A-U10, q: "How long does standard delivery take?", expect: ["3 to 5", "3-5", "three to five"]}
  - {id: A-U11, q: "Do you have express delivery and what does it cost?", expect: ["15"]}
  - {id: A-U12, q: "How fast is express delivery?", expect: ["1 business day", "one business day", "next day", "1 day"]}
  - {id: A-U13, q: "What is the warranty on electronics?", expect: ["1-year", "1 year", "one year", "12 months"]}
  - {id: A-U14, q: "What warranty do I get on a sofa?", expect: ["2-year", "2 year", "two year", "24 months"]}
  - {id: A-U15, q: "Can I pay with cash?", expect: ["cash on delivery"]}
  - {id: A-U16, q: "Which payment methods do you accept?", expect: ["credit card", "debit card"]}
  - {id: A-U17, q: "What is your support phone number?", expect: ["0800-555-0199", "08005550199"]}
  - {id: A-U18, q: "How can I email customer support?", expect: ["support@acme-home.example"]}
  - {id: A-U19, q: "How many loyalty points do I earn per dollar?", expect: ["1 point", "one point"]}
  - {id: A-U20, q: "How many points do I need for a voucher?", expect: ["100"]}
  - {id: A-U21, q: "What is the value of a loyalty voucher?", expect: ["5 dollar", "$5", "5 usd", "five dollar"]}
  - {id: A-U22, q: "Where is your store located?", expect: ["42 Market Street"]}
  - {id: A-U23, q: "Which city is the store in?", expect: ["Springfield"]}
