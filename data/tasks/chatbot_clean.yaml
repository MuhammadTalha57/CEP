  - {id: A-U02, q: "When do you close on Sundays?", expect: ["6 pm", "6pm", "6:00", "18:00"]}
  - {id: A-U03, q: "Are you open on Sunday morning at 10?", expect: ["11 am", "11am", "11:00"]}
  - {id: A-U04, q: "How many days do I have to return an item?", expect: ["30 days", "30"]}
  - {id: A-U05, q: "Do I need anything to return a product?", expect: ["receipt"]}
  - {id: A-U06, q: "How long does a refund take?", expect: ["5 business days", "five business days", "5 days"]}
  - {id: A-U07, q: "Where does my refund money go?", expect: ["original payment"]}
  - {id: A-U08, q: "Is delivery free?", expect: ["50"]}
