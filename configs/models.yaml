# Model registry (design.md §2). Switch models/providers here, never in code.
# Strings support ${VAR} and ${VAR:-default} from the environment (.env).
# Candidates are P05's small open models (P05 p1); final pick after the timing pilot (step 4.7).
# supports_tools / system_suffix / extra_body values are to be verified in the pilot.

models:
  - id: qwen3-1.7b
    backend: openai_compat
    base_url: ${OLLAMA_URL:-http://localhost:11434/v1}
    model: qwen3:1.7b
    supports_tools: true
    system_suffix: "/no_think"   # disable qwen3 thinking mode (too slow on CPU); reported in the paper

  - id: llama3.2-3b
    backend: openai_compat
    base_url: ${OLLAMA_URL:-http://localhost:11434/v1}
    model: llama3.2:3b
    supports_tools: true

  - id: gemma3-1b
    backend: openai_compat
    base_url: ${OLLAMA_URL:-http://localhost:11434/v1}
    model: gemma3:1b
    supports_tools: false        # [verify in pilot] used for apps A and B only if no tool support

  # Pinned tag. The bare `qwen3:4b` tag now points to Qwen3-4B-Thinking-2507 (thinking-only, ignores /no_think):
  # the 13 Nov Kaggle baseline got 73% empty outputs with it (results/excluded/, STATE.md 14 Nov).
  # Instruct-2507 is the non-thinking 4B; it is a later checkpoint than the qwen3:4b in P05 (not comparable).
  - id: qwen3-4b-instruct
    backend: openai_compat
    base_url: ${OLLAMA_URL:-http://localhost:11434/v1}
    model: qwen3:4b-instruct-2507-q4_K_M
    supports_tools: true

  - id: mock
    backend: mock
    model: mock
